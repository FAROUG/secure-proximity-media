services:
  postgres:
    image: postgres:18
    container_name: secure-media-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: secure_media
      POSTGRES_USER: secure_media
      POSTGRES_PASSWORD: secure_media_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:8
    container_name: secure-media-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
